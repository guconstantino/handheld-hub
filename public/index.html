<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handheld Hub</title>
  <meta name="description" content="Consoles portáteis do Gustavo (S20 FE, Miyoo Mini Plus, Switch OLED) e o acervo de jogos.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#overview">Handheld Hub</a>
      <nav class="nav">
        <a href="#overview" data-view="overview">Visão geral</a>
        <a href="#games" data-view="games">Jogos</a>
        <a href="#health" data-view="health">Saúde</a>
      </nav>
      <button id="themeToggle" class="icon-btn" title="Alternar tema" aria-label="Alternar tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="view" id="view-overview">
      <div>
        <h1>Consoles</h1>
        <p class="lead">Onde estão os jogos, quanto espaço sobra e o que precisa de atenção.</p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="devices" id="devices"></div>
    </section>

    <section class="view hidden" id="view-device"></section>

    <section class="view hidden" id="view-games">
      <div>
        <h1>Jogos</h1>
        <p class="lead" id="gamesCount">&nbsp;</p>
      </div>
      <div class="filters">
        <input type="search" id="q" placeholder="Buscar jogo" autocomplete="off" aria-label="Buscar jogo">
        <select id="fDevice" aria-label="Lugar"><option value="">Todos os lugares</option></select>
        <select id="fSystem" aria-label="Sistema"><option value="">Todos os sistemas</option></select>
        <select id="fStatus" aria-label="Estado">
          <option value="">Qualquer estado</option>
          <option value="ok">OK</option>
          <option value="corrupted">Corrompido</option>
          <option value="unknown">Não verificado</option>
        </select>
      </div>
      <table class="table" id="gamesTable">
        <thead><tr><th>Jogo</th><th>Sistema</th><th>Onde está</th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="btn hidden" id="more">Carregar mais</button>
    </section>

    <section class="view hidden" id="view-health">
      <div>
        <h1>Saúde do acervo</h1>
        <p class="lead">Arquivos com problema e jogos sem cópia de segurança.</p>
      </div>
      <div id="health" class="sections"></div>
    </section>
  </main>

  <footer><div class="wrap" id="footer">Carregando…</div></footer>
  <script src="app.js"></script>
</body>
</html>
